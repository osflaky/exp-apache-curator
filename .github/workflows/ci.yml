name: CI
on:
  workflow_dispatch:

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false 
    -Dmaven.wagon.http.retryHandler.class=standard 
    -Dmaven.wagon.http.retryHandler.count=3

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    name: Check [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    steps:
      # Keep LF line endings on Windows so header and style checks see the
      # same file contents as on Linux and macOS.
    - name: Disable CRLF conversion
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v3
    - name: Check license header
      if: runner.os == 'Linux'
      run: docker run --rm -v $(pwd):/github/workspace 
        ghcr.io/korandoru/hawkeye-native:v3 check

    - name: Cache Local Maven Repository
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'zulu'
      # Windows and macOS runners have no Docker to run the Linux hawkeye-native
      # container, so run the same hawkeye checker through its Maven plugin,
      # which reads the same licenserc.toml from the project root.
    - name: Check license header (Windows, macOS)
      if: runner.os != 'Linux'
      shell: bash
      run: ./mvnw -B -N io.korandoru.hawkeye:hawkeye-maven-plugin:check
    - name: Check code style
      shell: bash
      run: ./mvnw -B spotless:check

    timeout-minutes: 150
